<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spelarprofiler · Klaskligan</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07131f;--panel:#0d1d2f;--line:#29475f;--text:#eef5fb;--muted:#91a7ba;--teal:#43d7c4;--red:#ff6b6b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#102b42 0,#07131f 42%,#050d15 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.app{width:min(1120px,calc(100% - 28px));margin:24px auto 60px}.panel{background:linear-gradient(145deg,#0e2033,#0a1928);border:1px solid var(--line);border-radius:18px}.site-header{width:min(1120px,calc(100% - 28px));margin:14px auto 0;background:rgba(7,19,31,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;position:sticky;top:10px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.18)}.site-header-inner{min-height:64px;padding:9px 14px;display:flex;align-items:center;gap:26px}.site-brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:19px;font-weight:950;letter-spacing:-.4px}.site-brand-mark{width:30px;height:24px;position:relative}.site-brand-mark:before,.site-brand-mark:after{content:"";position:absolute;left:2px;right:2px;border:2px solid #526c84;border-radius:50%}.site-brand-mark:before{height:8px;bottom:2px}.site-brand-mark:after{height:5px;bottom:7px;left:7px;right:7px}.site-brand-mark i{position:absolute;left:11px;top:0;width:8px;height:8px;border:2px solid var(--teal);border-radius:50%;background:#0b1726}.site-nav{display:flex;gap:6px;flex:1}.site-nav a{color:#aebfd0;text-decoration:none;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:850}.site-nav a:hover{color:#fff;background:#11263a}.site-nav a.active{color:#fff;background:#173047;box-shadow:inset 0 -2px 0 var(--teal)}.site-admin-link{margin-left:auto;color:#dce8f2;text-decoration:none;border:1px solid #35556d;background:#10273b;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:850}.site-admin-link:hover{border-color:var(--teal)}
.page-head{padding:26px;margin-bottom:12px}.eyebrow{color:var(--teal);font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:900}.page-head h1{font-size:38px;letter-spacing:-1px;margin:5px 0 7px}.page-head p{margin:0;color:#aebfd0;max-width:650px}.players-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 12px}.players-toolbar h2{margin:0;font-size:20px}.search{width:min(300px,100%);padding:10px 12px;border:1px solid #35556d;border-radius:10px;background:#081725;color:#fff;outline:none}.search:focus{border-color:var(--teal)}.players-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.player-card{display:grid;grid-template-columns:78px 1fr;gap:15px;align-items:center;padding:16px;color:inherit;text-decoration:none;transition:.15s transform,.15s border-color;background:linear-gradient(145deg,#10263a,#0d2032);border:1px solid #27465e;border-radius:15px}.player-card:hover{transform:translateY(-2px);border-color:#3d776f}.avatar{width:78px;height:78px;border-radius:16px;border:1px solid #36566f;background:#13283d;display:grid;place-items:center;overflow:hidden;font-size:25px;font-weight:950;color:var(--teal)}.avatar img{width:100%;height:100%;object-fit:cover}.player-card h3{font-size:19px;margin:0 0 5px}.motto{color:#9fb2c2;font-size:12px;line-height:1.4;min-height:34px}.meta{margin-top:7px;color:#7690a5;font-size:11px;font-weight:750}.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed #35556d;border-radius:14px;grid-column:1/-1}
@media(max-width:820px){.players-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:680px){.site-header-inner{gap:8px;flex-wrap:wrap}.site-brand{font-size:17px}.site-nav{order:3;flex-basis:100%;border-top:1px solid rgba(53,82,107,.45);padding-top:7px}.site-nav a{flex:1;text-align:center;padding:8px 5px}.players-toolbar{align-items:stretch;flex-direction:column}.search{width:100%}}@media(max-width:500px){.players-grid{grid-template-columns:1fr}.page-head h1{font-size:31px}}

.site-auth-btn{cursor:pointer;font-family:inherit}.auth-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(2,8,14,.72);backdrop-filter:blur(4px);z-index:90}.auth-modal-backdrop.open{display:block}.auth-modal{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100% - 28px));padding:22px;z-index:91;box-shadow:0 28px 80px rgba(0,0,0,.48)}.auth-modal.open{display:block}.auth-modal h2{margin:0 0 16px;font-size:20px}.auth-modal-close{position:absolute;right:12px;top:10px;border:0;background:transparent;color:#a9bfd0;font-size:24px;cursor:pointer}.auth-modal input{width:100%;padding:11px 12px;margin-top:9px;border:1px solid #35556d;border-radius:10px;background:#081725;color:#fff;outline:none}.auth-modal .auth-submit{width:100%;margin-top:12px;padding:10px 12px;border:1px solid #39bdb3;border-radius:10px;background:linear-gradient(135deg,#2faaa5,#45c8bd);color:#fff;font-weight:850;cursor:pointer}.auth-error{min-height:18px;margin-top:9px;color:#ff9b9b;font-size:12px}
</style></head><body>
<header class="site-header"><div class="site-header-inner"><a class="site-brand" href="index.html"><span class="site-brand-mark"><i></i></span><span>KLASKLIGAN</span></a><nav class="site-nav"><a href="index.html">Tabell</a><a class="active" href="players.html">Spelarprofiler</a></nav><button id="siteAuthBtn" type="button" class="site-admin-link site-auth-btn">Logga in</button></div></header>
<main class="app"><section class="panel page-head"><div class="eyebrow">Spelare</div><h1>Spelarprofiler</h1><p>Välj en spelare för att se statistik, periodhistorik, form och H2H.</p></section><div class="players-toolbar"><h2>Alla spelare</h2><input id="playerSearch" class="search" type="search" placeholder="Sök spelare…"></div><div id="playersGrid" class="players-grid"><div class="empty">Laddar spelare…</div></div></main>

<div id="authModalBackdrop" class="auth-modal-backdrop"></div><div id="authModal" class="panel auth-modal"><button id="authModalClose" class="auth-modal-close" type="button" aria-label="Stäng">×</button><h2>Logga in</h2><input id="siteAuthEmail" type="email" placeholder="E-post" autocomplete="username"><input id="siteAuthPassword" type="password" placeholder="Lösenord" autocomplete="current-password"><button id="siteAuthSubmit" class="auth-submit" type="button">Logga in</button><div id="siteAuthError" class="auth-error"></div></div>
<script>
const SUPABASE_URL='https://kqfrpvlelpoabfpkqjwn.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxZnJwdmxlbHBvYWJmcGtxanduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDI3OTMsImV4cCI6MjEwMzQ3ODc5M30.GS747AnOYChYZbpvwKMrrEwQcDMaIBIP5apFlhczPi0';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let siteSignedIn=false;
function setSiteAuthButton(){const b=document.getElementById('siteAuthBtn');if(b)b.textContent=siteSignedIn?'Logga ut':'Logga in'}
function openSiteAuth(){document.getElementById('authModal')?.classList.add('open');document.getElementById('authModalBackdrop')?.classList.add('open');setTimeout(()=>document.getElementById('siteAuthEmail')?.focus(),40)}
function closeSiteAuth(){document.getElementById('authModal')?.classList.remove('open');document.getElementById('authModalBackdrop')?.classList.remove('open');}
async function initSiteAuth(){const {data:{session}}=await sb.auth.getSession();siteSignedIn=!!session;setSiteAuthButton();sb.auth.onAuthStateChange((_e,s)=>{siteSignedIn=!!s;setSiteAuthButton();if(!s)closeSiteAuth()});}
document.getElementById('siteAuthBtn')?.addEventListener('click',async()=>{if(siteSignedIn){await sb.auth.signOut();}else openSiteAuth()});
document.getElementById('authModalClose')?.addEventListener('click',closeSiteAuth);document.getElementById('authModalBackdrop')?.addEventListener('click',closeSiteAuth);
document.getElementById('siteAuthSubmit')?.addEventListener('click',async()=>{const email=document.getElementById('siteAuthEmail').value.trim(),password=document.getElementById('siteAuthPassword').value,err=document.getElementById('siteAuthError');err.textContent='';if(!email||!password){err.textContent='Fyll i e-post och lösenord.';return}const {error}=await sb.auth.signInWithPassword({email,password});if(error){err.textContent='Kunde inte logga in: '+error.message;return}document.getElementById('siteAuthPassword').value='';closeSiteAuth();location.reload()});
document.getElementById('siteAuthPassword')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('siteAuthSubmit')?.click()});
initSiteAuth();
let players=[];
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function initials(name){return String(name||'?').split(/\s+/).filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function render(){const q=document.getElementById('playerSearch').value.trim().toLowerCase();const list=players.filter(p=>String(p.name||'').toLowerCase().includes(q));document.getElementById('playersGrid').innerHTML=list.length?list.map(p=>{const image=p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:esc(initials(p.name));return `<a class="player-card" href="player.html?id=${encodeURIComponent(p.id)}"><div class="avatar">${image}</div><div><h3>${esc(p.name)}</h3><div class="motto">${p.motto?`“${esc(p.motto)}”`:'Ingen slogan ännu.'}</div><div class="meta">Öppna spelarprofil →</div></div></a>`}).join(''):'<div class="empty">Ingen spelare hittades.</div>'}
async function init(){const {data,error}=await sb.from('klask_state').select('data,archive').eq('id',1).single();if(error){document.getElementById('playersGrid').innerHTML='<div class="empty">Kunde inte läsa spelarna.</div>';return}const current=data?.data||{},archive=Array.isArray(data?.archive)?data.archive:[],map=new Map();[...(current.players||[]),...archive.flatMap(a=>a.players||[])].forEach(p=>{const id=Number(p.id);const old=map.get(id)||{};map.set(id,{...old,...p,id})});const {data:profiles}=await sb.from('klask_player_profiles').select('player_id,motto,image_url');const profileMap=new Map((profiles||[]).map(x=>[Number(x.player_id),x]));players=[...map.values()].map(p=>({...p,...(profileMap.get(Number(p.id))||{})})).sort((a,b)=>String(a.name).localeCompare(String(b.name),'sv'));render();document.getElementById('playerSearch').addEventListener('input',render)}init();
</script></body></html>
