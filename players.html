<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<script>(function(){try{if(localStorage.getItem('klask-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
<title>Spelarprofiler · Klaskligan</title>

<!-- Delad stilmall FÖRE sidans egna block, så sidlayouten kan överstyra utan !important -->
<link rel="stylesheet" href="global.css">
<style>
/* =============================================================================
   players.html — sidspecifik stil.
   Utseendet är återställt till originalet (mörkblått/teal, boxat sidhuvud,
   3-kolumnsrutnät med stora avatarer). Delade komponenter (.panel, .btn,
   .modal, .toast, header/nav, .avatar-basen) kommer från global.css; här
   överstyrs bara det som är unikt för spelarlistan.
   ============================================================================= */

/* Bas ---------------------------------------------------------------------- */
body{margin:0;background:var(--body-bg);color:var(--text);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{width:min(1120px,calc(100% - 28px));margin:48px auto 60px}

/* Sidhuvud (boxad panel) --------------------------------------------------- */
.page-head{background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:12px;box-shadow:none}
.eyebrow{color:var(--teal);font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:900}
.page-head h1{font-size:38px;letter-spacing:-1px;margin:5px 0 7px}
.page-head p{margin:0;color:var(--muted);max-width:650px}

/* Verktygsrad + sök -------------------------------------------------------- */
.players-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 12px}
.players-toolbar h2{margin:0;font-size:20px}
.search{width:min(300px,100%);padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--text);outline:none}
.search:focus{border-color:var(--teal)}

/* Spelarkort --------------------------------------------------------------- */
.players-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.player-card{display:grid;grid-template-columns:78px 1fr;gap:15px;align-items:center;padding:16px;color:inherit;text-decoration:none;transition:.15s transform,.15s border-color;background:linear-gradient(145deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:15px}
.player-card:hover{transform:translateY(-2px);border-color:var(--teal)}
.avatar{width:78px;height:78px;border-radius:16px;border:1px solid var(--line2);background:var(--card2);font-size:25px;font-weight:950;color:var(--teal)}
.player-card h3{font-size:19px;margin:0 0 5px}
.motto{color:var(--muted);font-size:12px;line-height:1.4;min-height:34px;font-style:italic}
.meta{margin-top:7px;color:var(--muted);font-size:11px;font-weight:750}
.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:14px;grid-column:1/-1}
.claim-badge{display:inline-block;margin-top:6px;font-size:11px;font-weight:800;color:var(--muted);background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:2px 8px}

@media(max-width:820px){.players-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.players-toolbar{align-items:stretch;flex-direction:column}.search{width:100%}}
@media(max-width:500px){.players-grid{grid-template-columns:1fr}.page-head h1{font-size:31px}}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
</head>
<body>

<div id="site-header-slot"></div>

<main class="app">
  <section class="panel page-head">
    <div class="eyebrow">Spelare</div>
    <h1>Spelarprofiler</h1>
    <p>Välj en spelare för att se statistik, periodhistorik, form och H2H.</p>
  </section>

  <div class="players-toolbar">
    <h2>Alla spelare</h2>
    <input id="playerSearch" class="search" type="search" placeholder="Sök spelare…">
  </div>

  <div id="playersGrid" class="players-grid">
    <div class="empty">Laddar spelare…</div>
  </div>
</main>

<div id="auth-modal-slot"></div>

<script>
(function () {
  'use strict';
  const esc = Klask.esc;
  const sb = Klask.supabase;

  let players = [];
  let activeIds = new Set();       // id:n för spelare i nuvarande (icke-arkiverade) rosters
  let claims = new Map();          // player_id -> claimed_email

  /** Hämtar vilka spelare som kopplat ett konto (klask_player_accounts). */
  async function fetchClaims() {
    const { data, error } = await sb.from('klask_player_accounts').select('player_id,claimed_email');
    if (error) { console.error('Kunde inte hämta kontokopplingar', error); return new Map(); }
    return new Map((data || []).map(r => [Number(r.player_id), r.claimed_email || '']));
  }

  /** Filtrerar på namn (skiftlägesokänsligt) och renderar kortrutnätet. */
  function render() {
    const q = document.getElementById('playerSearch').value.trim().toLowerCase();
    const list = players.filter(p => String(p.name || '').toLowerCase().includes(q));
    document.getElementById('playersGrid').innerHTML = list.length
      ? list.map(p => {
          const unclaimed = activeIds.has(p.id) && !claims.has(p.id);
          const badge = unclaimed ? '<span class="claim-badge">Ej kopplad till konto</span>' : '';
          return `<a class="player-card" href="player.html?id=${encodeURIComponent(p.id)}">` +
            Klask.renderAvatar(p, p, { alt: p.name }) +
            `<div><h3>${esc(p.name)}</h3>` +
            `<div class="motto">${p.motto ? esc(p.motto) : 'Ingen slogan ännu.'}</div>` +
            `<div class="meta">Öppna spelarprofil →</div>${badge}</div></a>`;
        }).join('')
      : '<div class="empty">Ingen spelare hittades.</div>';
  }

  async function init() {
    // Header/nav + inloggningsmodal. Sidan visar samma innehåll för alla
    // (adminläget styr bara Lottning-länken, vilket mountHeader sköter själv).
    Klask.mountHeader('players');
    Klask.mountAuthModal();

    const { data, archive } = await Klask.loadState();
    const profiles = await Klask.loadProfiles('player_id,motto,image_url');
    players = Klask.mergePlayersWithProfiles(data.players, profiles, archive);
    activeIds = new Set((data.players || []).map(p => Number(p.id)));
    claims = await fetchClaims();

    render();
    document.getElementById('playerSearch').addEventListener('input', render);
  }

  init();
})();
</script>
</body>
</html>
