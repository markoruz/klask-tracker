<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spelarprofil · KLASK</title>

<!-- Delad stilmall FÖRE sidans egna block, så sidlayouten kan överstyra utan !important -->
<link rel="stylesheet" href="global.css">
<style>
/* =============================================================================
   player.html — sidspecifik stil.

   Utseendet är det LJUSA temat (beige sida, blå accent). Originalfilen byggde
   upp sitt utseende med ~14 staplade style-block som överstyrde varandra med
   !important (två av dem låg efter avslutande html-tagg, dvs. sist i kaskaden).
   Här är kaskaden upplöst en gång för alla till ett enda platt block —
   samma renderade resultat, men utan dubbletter och död kod.

   Upplösta nyckelvärden (för den som jämför med originalet):
     · .profile-top-row  = minmax(0,1.65fr) minmax(280px,.75fr) vid >=901px
                           (profile-layout-v3-correction, ett av de sena blocken)
     · .highlights       = 2 kolumner i ALLA bredder
                           (.profile-top-row .highlights-panel .highlights vann
                            på specificitet i varje breakpoint)
     · #h2h.h2h-grid     = 3 kolumner vid >=901px, .h2h-combined-card över
                           kolumn 1-2 och .h2h-recent i kolumn 3
                           (requested-profile-fixes-v6, sist i källan)
     · .rivalry-layout   = display:block, .rivalry-summary 3 kolumner >980px
   ============================================================================= */

body{margin:0;background:var(--bg);color:var(--text);font-family:Poppins,system-ui,-apple-system,Segoe UI,sans-serif}
.app{width:min(1120px,calc(100% - 28px));margin:48px auto 60px}
.back{display:inline-flex;color:var(--muted);text-decoration:none;font-weight:800;margin-bottom:18px}
.back:hover{color:var(--teal)}
.empty{color:var(--muted);padding:18px;text-align:center}

/* Panel/knapp/avatar: originalet hade egna värden som låg efter global.css
   i kaskaden, så de överstyrs medvetet här. */
.panel{background:linear-gradient(145deg,#ffffff,#faf5ec);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:none}
.btn{border:1px solid #c9b79e;background:#ffffff;color:#2a1f16;border-radius:10px;padding:9px 12px;font-weight:850;cursor:pointer}
.btn:hover{border-color:var(--teal);filter:none}
.avatar{border-radius:22px;border:1px solid #c9b79e;background:#f5efe4;display:grid;place-items:center;overflow:hidden;font-size:48px;font-weight:950;color:var(--teal)}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.admin-btn{display:none}
.can-edit-profile .admin-btn{display:inline-flex}
.select{background:#ffffff;color:#2a1f16;border:1px solid #c9b79e;border-radius:9px;padding:7px 10px;font-weight:800}

/* Sektionsrubriker ------------------------------------------------------- */
.section{margin-top:18px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.section h2{margin:0;font-size:22px}
.eyebrow{color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:900}
.section-head>div>.eyebrow{margin-bottom:4px}

/* Toppraden: profil + statistik till vänster, highlights till höger ------ */
.profile-top-row{display:grid;grid-template-columns:1fr;gap:18px;align-items:start}
.profile-top-left{min-width:0;display:flex;flex-direction:column;gap:18px}
.profile-top-left .stats-panel{margin-top:0}
.profile-top-row .highlights-panel{min-width:0}
@media(min-width:901px){
  .profile-top-row{grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr);align-items:stretch}
  .profile-top-left,.profile-top-row .highlights-panel{align-self:stretch;height:auto}
  .profile-top-left .stats-panel{flex:1;display:flex;flex-direction:column}
  .profile-top-left .stats-panel .form-strip{margin-top:auto}
}

/* Hero (profilkortet) ---------------------------------------------------- */
.hero{display:grid;grid-template-columns:118px minmax(0,1fr);gap:18px;align-items:center;padding:18px}
.hero .avatar{width:118px;height:118px;border-radius:18px}
.hero h1{font-size:34px;margin:5px 0 6px}
.hero .admin-btn{grid-column:1/-1;justify-self:start}
.motto{font-size:16px;color:#6b5d4e;font-style:italic;margin:0}
@media(max-width:520px){
  .hero{grid-template-columns:86px 1fr}
  .hero .avatar{width:86px;height:86px}
  .hero h1{font-size:28px}
}

/* Statistik -------------------------------------------------------------- */
.stats-panel{overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
/* På desktop är cellerna avdelade med hårfina linjer inne i panelen (utan egen
   bakgrund), på mobil blir de egna kort — se breakpointen längre ner. */
.stats-panel .stat{background:transparent;border:0;border-right:1px solid var(--line);border-radius:0;padding:10px 14px}
.stats-panel .stat:last-child{border-right:0}
.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:850;letter-spacing:.05em}
.stat b{display:block;font-size:25px;margin-top:5px}

/* Formremsan (senaste 6) ------------------------------------------------- */
.form-strip{margin-top:18px;padding:14px 16px;border:1px solid #ddccb8;border-radius:13px;background:#f5efe4;display:flex;justify-content:space-between;align-items:center;gap:18px}
.form-strip .eyebrow{margin-bottom:3px}
.form-note{font-size:10px;color:var(--muted)}
.form{display:flex;gap:7px}
.dot{width:13px;height:13px;border-radius:50%;background:#249355}
.dot.loss{background:#c8443a}
@media(max-width:650px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats-panel .stat{border:1px solid #ddccb8;border-radius:12px;background:#f5efe4}
  .form-strip{align-items:flex-start;flex-direction:column}
}

/* Karriär · Highlights (två kolumner i alla bredder) --------------------- */
.highlights-panel{background:linear-gradient(155deg,#ffffff,#faf5ec 62%)}
.highlights{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.highlight-card{background:linear-gradient(145deg,#ffffff,#f5efe4);border:1px solid #ddccb8;border-radius:13px;display:flex;flex-direction:column;min-height:96px;padding:12px}
.highlight-icon{font-size:20px;line-height:1;margin-bottom:9px}
.highlight-label{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:850}
.highlight-value{font-size:22px;font-weight:950;margin-top:auto;padding-top:9px}
.highlight-sub{color:#6b5d4e;font-size:10px;margin-top:3px;line-height:1.35}
.career-summary{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.career-summary-text{color:#6b5d4e;font-size:12px}
.career-summary-text strong{color:#2a1f16}
@media(min-width:901px){
  .highlight-card{min-height:118px;padding:16px}
  .highlight-icon{font-size:25px}
  .highlight-value{font-size:28px}
  .career-summary{margin-top:13px;padding-top:14px}
}

/* Rivalitet & H2H -------------------------------------------------------- */
.rivalry-layout{display:block}
.rivalry-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:0 0 10px}
@media(max-width:980px){.rivalry-summary{grid-template-columns:1fr}}

.rivalry-card{border:1px solid #ddccb8;border-radius:13px;min-width:0}
.rivalry-feature{position:relative;min-height:132px;padding:13px 14px;background:linear-gradient(145deg,#ffffff,#f5efe4);overflow:hidden}
@media(max-width:650px){.rivalry-feature{min-height:116px}}
/* Denna regel (0,1,1) styr ALLA <span> i kortet — även .rivalry-icon och
   .rival-avatar, som bara har klasspecificitet (0,1,0). Det är därför ikonerna
   renderas i dämpad brun/grå färg i stället för rött/grönt, och det är exakt så
   originalet såg ut. */
.rivalry-card span{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.05em;font-weight:850}
.rivalry-feature .rivalry-label{color:#2a1f16;font-size:10px;font-weight:950;letter-spacing:.045em;margin-bottom:14px}
.rivalry-icon{position:absolute;right:17px;top:47px;width:36px;height:36px;border-radius:50%;background:#f5efe4}
.rivalry-icon-rival{background:#f0e6f5}
.rivalry-icon-danger{background:#fbe4e1}
.rivalry-icon-victim{background:#e2f5ea}
.rivalry-card .rivalry-icon{font-size:0}
.rivalry-icon svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rivalry-person{display:flex;align-items:center;gap:10px;min-width:0}
/* overflow:hidden + img-regeln nedan är en ren buggfix: utan den spretade
   uppladdade profilbilder utanför den runda ramen. */
.rival-avatar{width:46px;height:46px;flex:0 0 46px;border-radius:50%;overflow:hidden;background:#f5efe4;border:1px solid #c9b79e}
.rival-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.rivalry-person-copy{min-width:0;padding-right:36px}
.rivalry-feature .rivalry-person-copy b{display:block;font-size:18px;line-height:1.15;margin:0 0 4px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rivalry-feature .rivalry-person-copy small{display:block;margin:2px 0 0;color:#6b5d4e;font-size:11px;line-height:1.45}
.rivalry-loss-pct{color:#2a1f16;font-weight:950}

.h2h-grid{display:grid;grid-template-columns:1fr;gap:10px;align-items:stretch}
.h2h-combined-card{background:#ffffff;border:1px solid #ddccb8;border-radius:13px;padding:14px;display:grid;grid-template-columns:minmax(160px,.8fr) minmax(0,1.6fr);gap:16px;align-items:center;min-width:0}
/* Väljaren är medvetet utan egen yta — den ligger inne i .h2h-combined-card. */
.h2h-selector-card{background:transparent;border:0;border-radius:0;padding:0;display:flex;flex-direction:column;justify-content:center;min-width:0}
.h2h-selector-title{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.h2h-selector-card .select{width:100%;min-width:0;font-size:11px;padding:7px 28px 7px 9px}
.h2h-combined-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;align-items:stretch}
.h2h-metric{padding:5px 14px;border-left:1px solid #ddccb8;min-width:0}
.h2h-metric span{display:block;color:var(--muted);font-size:10px;line-height:1.25}
.h2h-metric b{display:block;font-size:22px;margin-top:5px;color:var(--text)}
.h2h-recent{grid-column:1;grid-row:auto;background:#ffffff;border:1px solid #ddccb8;border-radius:13px;padding:12px 14px;display:flex;flex-direction:column;justify-content:center}
.h2h-recent-title{font-size:11px;color:var(--muted);font-weight:850;text-transform:uppercase;letter-spacing:.05em;margin-bottom:9px}
.h2h-recent-dots{display:flex;gap:7px;align-items:center}
.h2h-recent-legend{margin-top:8px;color:#6b5d4e;font-size:9px;line-height:1.3}
.h2h-result{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:950;border:1px solid #c9b79e;background:#f5efe4;color:#2a1f16}
.h2h-result.me-loss{background:#fbe4e1;border-color:#e2a89e;color:#8a2e26}
.h2h-result.opp-loss{background:#e3ecfa;border-color:#3268d2;color:#1f4fa8}
.h2h-result.other-loss{background:#f5efe4;color:#6b5d4e}
@media(min-width:901px){
  .h2h-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .h2h-combined-card{grid-column:1/3;grid-row:1}
  .h2h-recent{grid-column:3;grid-row:1}
}
@media(max-width:900px){.h2h-selector-card{grid-column:1/-1}}
@media(max-width:650px){
  .h2h-combined-card{grid-template-columns:1fr}
  .h2h-combined-metrics{border-top:1px solid #ddccb8;padding-top:10px}
  .h2h-metric:first-child{border-left:0;padding-left:0}
}
@media(max-width:520px){.h2h-selector-card{grid-column:auto}}
@media(max-width:480px){
  .h2h-combined-metrics{grid-template-columns:1fr}
  .h2h-metric{border-left:0;border-top:1px solid #ddccb8;padding:10px 0}
  .h2h-metric:first-child{border-top:0}
}

/* Rankinghistorik (SVG-diagram) ------------------------------------------ */
/* Diagrammet ritas direkt mot panelens gradient (ingen egen kortyta) — därför
   är kontrastringen runt punkterna i SVG:en satt till bakgrundsfärgen. */
.chart-wrap{background:transparent;border:0;border-radius:14px;padding:4px 8px 0;overflow:visible}
.ranking-chart-scroll{width:100%;overflow-x:auto;overflow-y:hidden}
.ranking-chart{min-width:720px;width:100%;height:auto;display:block}
.chart-empty{color:var(--muted);padding:26px;text-align:center}
.chart-caption{display:flex;justify-content:space-between;gap:12px;color:#8a7a68;font-size:10px;margin-top:6px;padding:0 4px;box-sizing:border-box}
.chart-legend{display:flex;gap:12px;align-items:center}
.legend-dot{width:8px;height:8px;border-radius:50%;background:var(--teal);display:inline-block;margin-right:4px}
@media(max-width:760px){.ranking-chart{min-width:680px}}

/* Periodhistorik (tidslinje) --------------------------------------------- */
.period-list{display:grid;gap:8px;position:relative;padding-left:20px}
.period-list:before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:#c9b79e}
.period-row{position:relative;display:grid;grid-template-columns:minmax(150px,1fr) repeat(4,100px);gap:10px;align-items:center;padding:12px 14px;background:#ffffff;border:1px solid #ddccb8;border-radius:10px}
.period-row:before{content:"";position:absolute;left:-20px;top:50%;width:9px;height:9px;border-radius:50%;background:var(--teal);border:3px solid #ffffff;transform:translateY(-50%)}
.period-row .name{font-weight:900}
.period-row .num{text-align:right;color:#8a7a68}
@media(max-width:760px){.period-row{grid-template-columns:1fr 70px 70px}.period-row .hide-mobile{display:none}}
@media(max-width:480px){.period-row{grid-template-columns:1fr 58px 58px}}

/* Redigera-profil-modalen. Scoped till #editModal så att den delade
   inloggningsmodalen från global.css behåller sitt eget utseende.
   z-index lägre än headerns, precis som i originalet. */
#editModal{background:rgba(42,31,22,.45);padding:18px;z-index:20}
#editModal .modal-card{width:min(480px,100%);background:#ffffff;border:1px solid #ddccb8;border-radius:16px;padding:20px}
#editModal .modal-card h2{margin-top:0}
#editModal .field small{display:block;margin-top:7px;color:var(--muted)}
#currentImageNote{margin-top:7px;color:var(--muted);font-size:12px}
#removeImageBtn{margin-top:9px;display:none}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared.js"></script>
</head>
<body>

<div id="site-header-slot"></div>

<main class="app">
  <a class="back" href="players.html">← Alla spelarprofiler</a>

  <div class="profile-top-row">
    <div class="profile-top-left">
      <div id="profileHero" class="panel hero"><div class="empty">Laddar spelarprofil…</div></div>
      <section class="panel section stats-panel">
        <div class="section-head">
          <div><div class="eyebrow">Prestation</div><h2>Statistik</h2></div>
          <select id="periodSelect" class="select"></select>
        </div>
        <div id="stats" class="stats"></div>
        <div class="form-strip">
          <div><div class="eyebrow">Form · senaste 6</div><div class="form-note">Senaste matchen visas först</div></div>
          <div id="form" class="form"></div>
        </div>
      </section>
    </div>
    <section class="panel highlights-panel">
      <div class="section-head"><div><div class="eyebrow">Karriär</div><h2>Highlights</h2></div></div>
      <div id="highlights" class="highlights"></div>
      <div id="careerSummary" class="career-summary"></div>
    </section>
  </div>

  <section class="panel section rivalry-panel">
    <div class="section-head"><div><div class="eyebrow">Dueller</div><h2>Rivalitet &amp; H2H</h2></div></div>
    <div class="rivalry-layout">
      <div id="rivalrySummary" class="rivalry-summary"></div>
      <div id="h2h" class="h2h-grid"></div>
    </div>
  </section>

  <section class="panel section ranking-panel">
    <div class="section-head"><div><div class="eyebrow">Karriärkurva</div><h2>Rankinghistorik</h2></div></div>
    <div id="rankingHistory" class="chart-wrap"></div>
  </section>

  <section class="panel section period-panel">
    <div class="section-head"><div><div class="eyebrow">Arkiv</div><h2>Periodhistorik</h2></div></div>
    <div id="periodHistory" class="period-list"></div>
  </section>

  <!-- Dold hållare för valet av H2H-motståndare. Den synliga väljaren renderas
       inne i H2H-kortet (#opponentSelectInner) och speglar sitt värde hit. -->
  <select id="opponentSelect" class="hidden" aria-hidden="true" tabindex="-1"></select>
</main>

<div id="editModal" class="modal hidden">
  <div class="modal-card">
    <h2>Redigera profil</h2>
    <div class="field">
      <label for="editMotto">Motto / slogan</label>
      <input id="editMotto" maxlength="120">
    </div>
    <div class="field">
      <label for="editImageFile">Profilbild</label>
      <input id="editImageFile" type="file" accept="image/jpeg,image/png,image/webp">
      <small>JPG, PNG eller WebP. Bilden laddas upp till Supabase Storage.</small>
      <div id="currentImageNote"></div>
      <button id="removeImageBtn" type="button" class="btn">Ta bort profilbild</button>
    </div>
    <div class="actions">
      <button id="cancelEdit" class="btn">Avbryt</button>
      <button id="saveEdit" class="btn">Spara</button>
    </div>
  </div>
</div>

<div id="auth-modal-slot"></div>

<script>
(function () {
  'use strict';

  const esc = Klask.esc;
  const $ = s => document.querySelector(s);
  const MIN = Klask.MIN_MATCHES;

  const playerId = Number(new URLSearchParams(location.search).get('id')) || 5;

  let current = null;            // data-kolumnen (normaliserad av Klask.loadState)
  let archive = [];              // archive-kolumnen
  let players = [];              // nuvarande + arkiverade spelare, med profilfält
  let profilePlayer = null;      // spelaren som visas på den här sidan
  let canEditProfile = false;    // can_edit_klask_player — styr ENDAST redigeraknappen
  let removeImageRequested = false;

  /* ---------------------------------------------------------------------------
     Perioder + statistik
     --------------------------------------------------------------------------- */
  function periods() {
    return [
      { key: 'current', name: (current.listName || 'Pågående period'), rounds: current.rounds || [], players: current.players || [], current: true },
      ...archive.map(a => ({ key: 'a:' + a.id, name: a.name || 'Tidigare period', rounds: a.rounds || [], players: a.players || [], current: false }))
    ];
  }

  function allTimeRounds() { return periods().flatMap(p => p.rounds || []); }

  /** Matcher/förluster/förlust-% + Bayesian score (delad formel) + form (senaste 6). */
  function statsFor(pid, rounds) {
    const mine = [...rounds]
      .sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0))
      .filter(r => (r.player_ids || []).map(Number).includes(pid));
    const losses = mine.filter(r => Number(r.loser_id) === pid).length;
    const games = mine.length;
    const pct = games ? losses / games * 100 : null;
    const score = Klask.computeRankingScore(games, losses);
    const form = mine.slice(-6).reverse().map(r => Number(r.loser_id) === pid ? 'loss' : 'ok');
    return { games, losses, pct, score, form };
  }

  function selectedPeriod() {
    const k = $('#periodSelect').value;
    if (k === 'all') return { name: 'Totalt', rounds: periods().flatMap(p => p.rounds) };
    return periods().find(p => p.key === k) || periods()[0];
  }

  /** Placering bland kvalificerade spelare i en period (delad sorteringsordning). */
  function rankInPeriod(pid, p) {
    const qualified = (p.players || players).map(pl => {
      const id = Number(pl.id);
      const s = statsFor(id, p.rounds);
      return { id, name: String(pl.name || ''), games: s.games, losses: s.losses, loss_pct: s.pct, rank_score: s.score };
    }).filter(x => x.games >= MIN);
    const i = Klask.rankingOrder(qualified).findIndex(x => x.id === Number(pid));
    return i >= 0 ? i + 1 : null;
  }

  /* ---------------------------------------------------------------------------
     Karriär- och rivalitetsmått
     --------------------------------------------------------------------------- */
  function longestSafeStreak(rounds, pid) {
    const mine = [...rounds]
      .filter(r => (r.player_ids || []).map(Number).includes(pid))
      .sort((a, b) => new Date(a.played_at) - new Date(b.played_at));
    let best = 0, run = 0;
    mine.forEach(r => { if (Number(r.loser_id) === pid) run = 0; else { run++; best = Math.max(best, run); } });
    return best;
  }

  function currentSafeStreak(rounds, pid) {
    const mine = [...rounds]
      .filter(r => (r.player_ids || []).map(Number).includes(pid))
      .sort((a, b) => new Date(a.played_at) - new Date(b.played_at));
    let run = 0;
    for (let i = mine.length - 1; i >= 0; i--) { if (Number(mine[i].loser_id) === pid) break; run++; }
    return run;
  }

  function careerMetrics() {
    const ps = periods().map(p => ({ p, s: statsFor(playerId, p.rounds), pos: rankInPeriod(playerId, p) })).filter(x => x.s.games > 0);
    const archived = ps.filter(x => !x.p.current);
    const all = statsFor(playerId, allTimeRounds());
    const wins = archived.filter(x => x.pos === 1).length;
    const podiums = archived.filter(x => x.pos && x.pos <= 3).length;
    const bestPositions = ps.map(x => x.pos).filter(Boolean);
    const bestPosition = bestPositions.length ? Math.min(...bestPositions) : null;
    const bestScore = ps.map(x => x.s.score).filter(Number.isFinite).sort((a, b) => a - b)[0] ?? null;
    const longest = longestSafeStreak(allTimeRounds(), playerId);
    const currentStreak = currentSafeStreak(allTimeRounds(), playerId);
    const badges = [];
    if (wins) badges.push({ icon: '🏆', label: wins > 1 ? 'Flerfaldig vinnare' : 'Periodvinnare' });
    if (podiums >= 3) badges.push({ icon: '🥇', label: 'Pallräv' });
    if (all.games >= 75) badges.push({ icon: '🎮', label: 'Veteran' });
    else if (all.games >= 40) badges.push({ icon: '⚡', label: 'Rutinerad' });
    if (longest >= 12) badges.push({ icon: '🔥', label: 'Streak master' });
    else if (currentStreak >= 6) badges.push({ icon: '🔥', label: 'Formstark' });
    if (bestPosition === 1 && !wins) badges.push({ icon: '📈', label: 'Topprankad' });
    return { ps, archived, all, wins, podiums, bestPosition, bestScore, longest, currentStreak, badges };
  }

  function rivalryMetrics() {
    const rounds = allTimeRounds();
    const others = players.filter(p => Number(p.id) !== playerId);
    const rows = others.map(opp => {
      const oid = Number(opp.id);
      const together = rounds.filter(r => {
        const ids = (r.player_ids || []).map(Number);
        return ids.includes(playerId) && ids.includes(oid);
      });
      const myLoss = together.filter(r => Number(r.loser_id) === playerId).length;
      const oppLoss = together.filter(r => Number(r.loser_id) === oid).length;
      return { opp, together: together.length, myLoss, oppLoss };
    }).filter(x => x.together > 0);
    rows.sort((a, b) => b.together - a.together || b.myLoss - a.myLoss);
    const rival = rows[0] || null;
    const danger = [...rows].sort((a, b) => b.myLoss - a.myLoss || b.together - a.together)[0] || null;
    const victim = [...rows].sort((a, b) => b.oppLoss - a.oppLoss || b.together - a.together)[0] || null;
    return { rival, danger, victim };
  }

  /* ---------------------------------------------------------------------------
     Rendering
     --------------------------------------------------------------------------- */
  function openEditModal() {
    $('#editMotto').value = profilePlayer.motto || '';
    $('#editImageFile').value = '';
    removeImageRequested = false;
    $('#currentImageNote').textContent = profilePlayer.image_url
      ? 'Nuvarande profilbild finns sparad. Välj en ny fil för att ersätta den.'
      : 'Ingen profilbild uppladdad ännu.';
    $('#removeImageBtn').style.display = profilePlayer.image_url ? 'inline-flex' : 'none';
    $('#editModal').classList.remove('hidden');
  }

  function renderHero() {
    $('#profileHero').innerHTML =
      Klask.renderAvatar(profilePlayer, profilePlayer, { className: 'avatar', alt: profilePlayer.name, lazy: false }) +
      `<div><div class="eyebrow">Spelarprofil</div><h1>${esc(profilePlayer.name)}</h1>` +
      `<p class="motto">${profilePlayer.motto ? esc(profilePlayer.motto) : 'Ingen slogan ännu.'}</p></div>` +
      `<button id="editProfileBtn" class="btn admin-btn">Redigera profil</button>`;
    const btn = $('#editProfileBtn');
    if (btn) btn.addEventListener('click', openEditModal);
  }

  function renderHighlights() {
    const m = careerMetrics();
    const bestPos = m.bestPosition ? `#${m.bestPosition}` : '–';
    const bestScore = m.bestScore == null ? '–' : m.bestScore.toFixed(2).replace('.', ',');
    $('#highlights').innerHTML =
      `<div class="highlight-card"><div class="highlight-icon">🏆</div><div class="highlight-label">Ligavinster</div><div class="highlight-value">${m.wins}</div><div class="highlight-sub">${m.podiums} pallplacering${m.podiums === 1 ? '' : 'ar'}</div></div>` +
      `<div class="highlight-card"><div class="highlight-icon">📈</div><div class="highlight-label">Bästa placering</div><div class="highlight-value">${bestPos}</div><div class="highlight-sub">Bästa Bayesian: ${bestScore}</div></div>` +
      `<div class="highlight-card"><div class="highlight-icon">🔥</div><div class="highlight-label">Längsta svit</div><div class="highlight-value">${m.longest}</div><div class="highlight-sub">matcher utan förlust</div></div>` +
      `<div class="highlight-card"><div class="highlight-icon">🎮</div><div class="highlight-label">Karriärmatcher</div><div class="highlight-value">${m.all.games}</div><div class="highlight-sub">${m.all.losses} registrerade förluster</div></div>`;
    const first = m.ps.length ? m.ps[m.ps.length - 1].p.name : null;
    $('#careerSummary').innerHTML =
      `<div class="career-summary-text">Aktuell svit: <strong>${m.currentStreak} matcher utan förlust</strong>` +
      `${first ? ` · Statistik finns från <strong>${esc(first)}</strong>` : ''}</div>`;
  }

  function renderRivalrySummary() {
    const m = rivalryMetrics();
    const avatar = r => Klask.renderAvatar(r.opp, r.opp, { className: 'rival-avatar', alt: r.opp.name });
    const card = (label, r, icon, iconClass, details) => r
      ? `<div class="rivalry-card rivalry-feature"><span class="rivalry-label">${label}</span>` +
        `<span class="rivalry-icon ${iconClass}">${icon}</span>` +
        `<div class="rivalry-person">${avatar(r)}<div class="rivalry-person-copy"><b>${esc(r.opp.name)}</b>${details(r)}</div></div></div>`
      : `<div class="rivalry-card rivalry-feature"><span class="rivalry-label">${label}</span>` +
        `<div class="rivalry-person"><div class="rivalry-person-copy"><b>–</b><small>Ingen data ännu</small></div></div></div>`;
    const myPct = x => `<small>${x.together} matcher tillsammans</small><small>Din förlustprocent: <strong class="rivalry-loss-pct">${x.together ? (x.myLoss / x.together * 100).toFixed(0) : 0}%</strong></small>`;

    $('#rivalrySummary').innerHTML =
      card('Största rival', m.rival,
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 18.5 1.5l1 1-4 4M9.5 14.5l-4 4-3 1 1-3 4-4M5.5 5.5l13 13M3.5 2.5l17 17"/></svg>',
        'rivalry-icon-rival', myPct) +
      card('Tuffaste sällskap', m.danger,
        '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 19 5v6c0 5-3 8.5-7 11-4-2.5-7-6-7-11V5l7-3Z"/><path d="M12 6v11M9 9h6"/></svg>',
        'rivalry-icon-danger', myPct) +
      card('Mest utsatt motspelare', m.victim,
        '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4"/></svg>',
        'rivalry-icon-victim',
        x => `<small>${x.together} matcher tillsammans</small><small>${esc(x.opp.name)}s förlustprocent: <strong class="rivalry-loss-pct">${x.together ? (x.oppLoss / x.together * 100).toFixed(0) : 0}%</strong></small>`);
  }

  /* Rankinghistorik: en punkt per period, äldst först. */
  function chronologicalPeriods() { return [...periods()].reverse(); }

  function rankingSeriesForAll() {
    return chronologicalPeriods().map(p => ({ label: p.name, pos: rankInPeriod(playerId, p), title: `${p.name}` }));
  }

  function renderRankingChart(points, caption, emptyMessage) {
    const root = $('#rankingHistory');
    if (!root) return;
    if (!points.length) { root.innerHTML = `<div class="chart-empty">${esc(emptyMessage || 'Ingen rankinghistorik ännu.')}</div>`; return; }
    const ranked = points.filter(p => Number.isFinite(p.pos));
    if (!ranked.length) { root.innerHTML = `<div class="chart-empty">${esc(emptyMessage || `Ingen kvalificerad ranking ännu. Minst ${MIN} matcher krävs.`)}</div>`; return; }

    const maxPos = Math.max(3, ...ranked.map(p => p.pos));
    const W = 1000, H = 310, L = 62, R = 38, T = 28, B = 72, plotW = W - L - R, plotH = H - T - B;
    const x = i => points.length === 1 ? L + plotW / 2 : L + i * (plotW / (points.length - 1));
    const y = pos => T + (pos - 1) * (plotH / Math.max(1, maxPos - 1));

    // SVG-attribut kan inte läsa CSS-variabler — färgerna nedan är det ljusa
    // temats hårdkodade värden: rutnät #e3d5c2, axeltext #8a7a68,
    // linje/punkt #3268d2 och kontrastring #ffffff.
    const grid = Array.from({ length: maxPos }, (_, i) => i + 1).map(pos =>
      `<line x1="${L}" y1="${y(pos)}" x2="${W - R}" y2="${y(pos)}" stroke="#e3d5c2"/>` +
      `<text x="${L - 13}" y="${y(pos) + 4}" text-anchor="end" fill="#8a7a68" font-size="11">${pos}</text>`
    ).join('');

    const maxLabels = 10, step = Math.max(1, Math.ceil(points.length / maxLabels));
    const labels = points.map((p, i) => {
      if (i !== 0 && i !== points.length - 1 && i % step !== 0) return '';
      const anchor = i === 0 ? 'start' : i === points.length - 1 ? 'end' : 'middle';
      return `<text x="${x(i)}" y="${H - 28}" text-anchor="${anchor}" fill="#8a7a68" font-size="10">${esc(p.label)}</text>`;
    }).join('');

    const segments = []; let seg = [];
    points.forEach((p, i) => {
      if (Number.isFinite(p.pos)) seg.push({ x: x(i), y: y(p.pos), p });
      else if (seg.length) { segments.push(seg); seg = []; }
    });
    if (seg.length) segments.push(seg);

    const paths = segments.map(arr =>
      `<path d="${arr.map((v, i) => `${i ? 'L' : 'M'} ${v.x.toFixed(1)} ${v.y.toFixed(1)}`).join(' ')}" fill="none" stroke="#3268d2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`
    ).join('');

    const dots = points.map((p, i) => Number.isFinite(p.pos)
      ? `<circle cx="${x(i)}" cy="${y(p.pos)}" r="5" fill="#3268d2" stroke="#ffffff" stroke-width="3"><title>${esc(p.title)}: #${p.pos}</title></circle>`
      : '').join('');

    root.innerHTML =
      `<div class="ranking-chart-scroll"><svg class="ranking-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rankinghistorik">${grid}${paths}${dots}${labels}</svg></div>` +
      `<div class="chart-caption"><span>Lägre placering är bättre</span><span class="chart-legend"><span><i class="legend-dot"></i>${esc(caption)}</span></span></div>`;
  }

  function renderRankingHistory() {
    renderRankingChart(rankingSeriesForAll(), 'Placering per månad', 'Ingen kvalificerad rankinghistorik ännu.');
  }

  function renderSelectors() {
    const options = '<option value="all">Totalt · alla perioder</option>' +
      periods().map(p => `<option value="${p.key}">${esc(p.name)}${p.current ? ' · aktuell' : ''}</option>`).join('');
    const ps = $('#periodSelect');
    ps.innerHTML = options;
    ps.value = 'all';

    const opp = $('#opponentSelect');
    opp.innerHTML = players.filter(p => Number(p.id) !== playerId)
      .map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
    const rival = rivalryMetrics().rival;
    if (rival && [...opp.options].some(o => Number(o.value) === Number(rival.opp.id))) opp.value = String(rival.opp.id);
  }

  function currentPeriodForm() {
    const mine = [...(current && current.rounds || [])]
      .sort((a, b) => (Number(a.id) || 0) - (Number(b.id) || 0))
      .filter(r => (r.player_ids || []).map(Number).includes(playerId));
    return mine.slice(-6).reverse().map(r => Number(r.loser_id) === playerId ? 'loss' : 'ok');
  }

  function renderProfileForm() {
    const form = currentPeriodForm();
    $('#form').innerHTML = form.length
      ? form.map(x => `<span class="dot ${x === 'loss' ? 'loss' : ''}"></span>`).join('')
      : '<span style="color:var(--muted)">Ingen formdata</span>';
  }

  function renderStats() {
    const p = selectedPeriod(), s = statsFor(playerId, p.rounds);
    // "Totalt · alla perioder" har ingen key och därmed ingen placering.
    const position = p.key ? rankInPeriod(playerId, p) : null;
    $('#stats').innerHTML =
      `<div class="stat"><span>Matcher</span><b>${s.games}</b></div>` +
      `<div class="stat"><span>Förluster</span><b>${s.losses}</b></div>` +
      `<div class="stat"><span>Förlust %</span><b>${s.pct == null ? '–' : s.pct.toFixed(1).replace('.', ',') + '%'}</b></div>` +
      `<div class="stat"><span>Bayesian score</span><b>${s.score == null ? '–' : s.score.toFixed(2).replace('.', ',')}</b></div>` +
      `<div class="stat"><span>Placering</span><b>${position ? position + '.' : '–'}</b></div>`;
    renderProfileForm();
    renderH2H();
    renderRivalrySummary();
  }

  function renderH2H() {
    const oppId = Number($('#opponentSelect').value);
    const opp = players.find(p => Number(p.id) === oppId);
    if (!opp) { $('#h2h').innerHTML = '<div class="empty">Ingen motspelare.</div>'; return; }

    const rounds = selectedPeriod().rounds.filter(r => {
      const ids = (r.player_ids || []).map(Number);
      return ids.includes(playerId) && ids.includes(oppId);
    });
    const mine = rounds.filter(r => Number(r.loser_id) === playerId).length;
    const theirs = rounds.filter(r => Number(r.loser_id) === oppId).length;
    const recent = [...rounds].sort((a, b) => new Date(b.played_at) - new Date(a.played_at)).slice(0, 6);

    const recentHtml = recent.length ? recent.map(r => {
      const loser = Number(r.loser_id);
      const cls = loser === playerId ? 'me-loss' : (loser === oppId ? 'opp-loss' : 'other-loss');
      const txt = loser === playerId ? 'F' : (loser === oppId ? 'M' : 'Ö');
      const title = loser === playerId ? profilePlayer.name + ' förlorade'
        : (loser === oppId ? opp.name + ' förlorade' : 'Annan spelare förlorade');
      return `<span class="h2h-result ${cls}" title="${esc(title)}">${txt}</span>`;
    }).join('') : '<span style="color:var(--muted);font-size:11px">Ingen gemensam historik</span>';

    const selectHtml = `<div class="h2h-selector-card"><div class="h2h-selector-title">H2H mot vald spelare</div>` +
      `<select id="opponentSelectInner" class="select">` +
      players.filter(p => Number(p.id) !== playerId)
        .map(p => `<option value="${p.id}"${Number(p.id) === oppId ? ' selected' : ''}>${esc(p.name)}</option>`).join('') +
      `</select></div>`;

    $('#h2h').innerHTML =
      `<div class="h2h-combined-card">${selectHtml}<div class="h2h-combined-metrics">` +
      `<div class="h2h-metric"><span>Matcher tillsammans</span><b>${rounds.length}</b></div>` +
      `<div class="h2h-metric"><span>${esc(profilePlayer.name)} förlorade</span><b>${mine}</b></div>` +
      `<div class="h2h-metric"><span>${esc(opp.name)} förlorade</span><b>${theirs}</b></div>` +
      `</div></div>` +
      `<div class="h2h-recent"><div class="h2h-recent-title">Senaste 6 gemensamma matcher</div>` +
      `<div class="h2h-recent-dots">${recentHtml}</div>` +
      `<div class="h2h-recent-legend">F = ${esc(profilePlayer.name)} förlorade · M = motståndaren · Ö = övrig</div></div>`;

    const inner = $('#opponentSelectInner');
    if (inner) inner.onchange = () => { $('#opponentSelect').value = inner.value; renderH2H(); };
  }

  function renderHistory() {
    const items = periods().map(p => {
      const s = statsFor(playerId, p.rounds), pos = rankInPeriod(playerId, p);
      return { s, p, pos };
    }).filter(x => x.s.games > 0);
    $('#periodHistory').innerHTML = items.length
      ? items.map(({ s, p, pos }) =>
          `<div class="period-row"><div class="name">${esc(p.name)}</div>` +
          `<div class="num">${s.games} matcher</div>` +
          `<div class="num">${s.losses} förl.</div>` +
          `<div class="num hide-mobile">${s.pct == null ? '–' : s.pct.toFixed(1).replace('.', ',') + '%'}</div>` +
          `<div class="num hide-mobile">${pos ? pos + '.' : 'DNQ'}</div></div>`
        ).join('')
      : '<div class="empty">Ingen periodhistorik ännu.</div>';
  }

  /* ---------------------------------------------------------------------------
     Spara profil (motto + bild i Supabase Storage)
     --------------------------------------------------------------------------- */
  async function saveProfile() {
    if (!canEditProfile) return alert('Du har inte behörighet att redigera den här profilen.');
    const saveBtn = $('#saveEdit');
    const file = $('#editImageFile')?.files?.[0] || null;
    if (file && !['image/jpeg', 'image/png', 'image/webp'].includes(file.type)) return alert('Välj en JPG-, PNG- eller WebP-bild.');
    if (file && file.size > 5 * 1024 * 1024) return alert('Bilden får vara högst 5 MB.');
    saveBtn.disabled = true;
    saveBtn.textContent = 'Sparar…';
    try {
      let imageUrl = profilePlayer.image_url || '';
      let imagePath = profilePlayer.image_path || '';

      if (removeImageRequested && imagePath) {
        const { error: removeError } = await Klask.supabase.storage.from('klask-images').remove([imagePath]);
        if (removeError) throw removeError;
        imageUrl = ''; imagePath = '';
      }

      if (file) {
        const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '');
        const path = `player-images/${playerId}/profile.${ext || 'jpg'}`;
        if (imagePath && imagePath !== path) {
          await Klask.supabase.storage.from('klask-images').remove([imagePath]);
        }
        const { error: uploadError } = await Klask.supabase.storage.from('klask-images')
          .upload(path, file, { upsert: true, contentType: file.type, cacheControl: '3600' });
        if (uploadError) throw uploadError;
        const { data: publicData } = Klask.supabase.storage.from('klask-images').getPublicUrl(path);
        imageUrl = `${publicData.publicUrl}?v=${Date.now()}`;
        imagePath = path;
      }

      const motto = $('#editMotto').value.trim();
      const { data: sessionData } = await Klask.auth.getSession();
      const userId = (sessionData && sessionData.session && sessionData.session.user && sessionData.session.user.id) || null;
      const { error } = await Klask.supabase.from('klask_player_profiles').upsert({
        player_id: playerId,
        motto,
        image_url: imageUrl,
        image_path: imagePath,
        updated_at: new Date().toISOString(),
        updated_by: userId
      }, { onConflict: 'player_id' });
      if (error) throw error;

      profilePlayer = { ...profilePlayer, motto, image_url: imageUrl, image_path: imagePath };
      $('#editModal').classList.add('hidden');
      renderHero();
    } catch (err) {
      alert(err?.message || 'Kunde inte spara profilen. Kontrollera Supabase-policies.');
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Spara';
    }
  }

  /* ---------------------------------------------------------------------------
     Init
     --------------------------------------------------------------------------- */
  async function init() {
    // Modalen monteras först (synkront) så att headerns Admin-knapp kan öppna den.
    Klask.mountAuthModal({ reloadOnSignIn: true });
    const [headerState, state] = await Promise.all([
      Klask.mountHeader('player'),   // sköter även body.is-admin + Lottning-länken
      Klask.loadState()
    ]);

    if (!playerId) { $('#profileHero').innerHTML = '<div class="empty">Ingen spelare vald.</div>'; return; }

    current = state.data;
    archive = state.archive;

    // Profilfält (motto/bild) läses från klask_player_profiles och slås ihop med
    // nuvarande + arkiverade spelare. sort:false behåller den gamla ordningen
    // (data.players först, sedan arkivsnapshots) — den styr bl.a. vem som blir
    // "Största rival" vid lika värden och ordningen i motståndarlistan.
    const profiles = await Klask.loadProfiles();
    players = Klask.mergePlayersWithProfiles(current.players, profiles, archive, { sort: false });

    profilePlayer = players.find(p => Number(p.id) === playerId) || null;
    if (!profilePlayer) { $('#profileHero').innerHTML = '<div class="empty">Spelaren hittades inte.</div>'; return; }
    profilePlayer.image_path = (profilePlayer.profile && profilePlayer.profile.image_path) || '';

    // EN behörighetskontroll: can_edit_klask_player styr bara redigeraknappen.
    // Adminrollen (body.is-admin) är redan avgjord av mountHeader.
    canEditProfile = headerState.signedIn ? await Klask.auth.canEditPlayer(playerId) : false;
    document.body.classList.toggle('can-edit-profile', canEditProfile);

    renderHero();
    renderSelectors();
    renderStats();
    renderHighlights();
    renderRankingHistory();
    renderHistory();

    $('#periodSelect').onchange = renderStats;
    $('#opponentSelect').onchange = renderH2H;
    $('#cancelEdit').onclick = () => $('#editModal').classList.add('hidden');
    $('#removeImageBtn').onclick = () => {
      removeImageRequested = true;
      $('#editImageFile').value = '';
      $('#currentImageNote').textContent = 'Profilbilden tas bort när du sparar.';
      $('#removeImageBtn').style.display = 'none';
    };
    $('#saveEdit').onclick = saveProfile;
  }

  init();
})();
</script>
