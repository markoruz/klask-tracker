<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spelarprofil · KLASK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#07131f;--panel:#0d1d2f;--panel2:#13263a;--line:#29475f;--text:#eef5fb;--muted:#91a7ba;--teal:#43d7c4;--red:#ff6b6b;--gold:#f4c542}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#102b42 0,#07131f 38%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{width:min(1120px,calc(100% - 28px));margin:28px auto 60px}.back{display:inline-flex;color:var(--muted);text-decoration:none;font-weight:800;margin-bottom:18px}.back:hover{color:var(--teal)}.panel{background:linear-gradient(145deg,#0e2033,#0a1928);border:1px solid var(--line);border-radius:18px;padding:22px}.hero{display:grid;grid-template-columns:150px 1fr auto;gap:22px;align-items:center}.avatar{width:150px;height:150px;border-radius:22px;border:1px solid #36566f;background:#13283d;display:grid;place-items:center;overflow:hidden;font-size:48px;font-weight:950;color:var(--teal)}.avatar img{width:100%;height:100%;object-fit:cover}.eyebrow{color:var(--teal);font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:900}.hero h1{font-size:42px;margin:5px 0 6px}.motto{font-size:16px;color:#b9cad7;font-style:italic;margin:0}.admin-btn{display:none}.can-edit-profile .admin-btn{display:inline-flex}.btn{border:1px solid #35556d;background:#10273b;color:#e9f2f8;border-radius:10px;padding:9px 12px;font-weight:850;cursor:pointer}.btn:hover{border-color:var(--teal)}.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section h2{margin:0;font-size:22px}.select{background:#0b1d2d;color:#fff;border:1px solid #35556d;border-radius:9px;padding:7px 10px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{background:#10263a;border:1px solid #27465e;border-radius:13px;padding:15px}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;font-weight:850;letter-spacing:.05em}.stat b{display:block;font-size:25px;margin-top:5px}.form{display:flex;gap:7px}.dot{width:13px;height:13px;border-radius:50%;background:#43d7c4}.dot.loss{background:#ff6b6b}.h2h-grid{display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:10px}.h2h-card{background:#10263a;border:1px solid #27465e;border-radius:13px;padding:16px}.h2h-card span{color:var(--muted);font-size:11px}.h2h-card b{display:block;font-size:24px;margin-top:4px}.period-list{display:grid;gap:8px}.period-row{display:grid;grid-template-columns:minmax(150px,1fr) repeat(4,100px);gap:10px;align-items:center;padding:12px 14px;background:#10263a;border:1px solid #27465e;border-radius:11px}.period-row .name{font-weight:900}.period-row .num{text-align:right;color:#c5d3de}.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:18px;z-index:20}.modal.hidden{display:none}.modal-card{width:min(480px,100%);background:#0d1d2f;border:1px solid #35556d;border-radius:16px;padding:20px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;color:var(--muted);font-weight:850}.field input{width:100%;padding:10px;border-radius:9px;border:1px solid #35556d;background:#081725;color:#fff}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.empty{color:var(--muted);padding:18px;text-align:center}@media(max-width:760px){.hero{grid-template-columns:90px 1fr}.avatar{width:90px;height:90px;border-radius:16px}.hero h1{font-size:30px}.hero .admin-btn{grid-column:1/-1}.stats{grid-template-columns:repeat(2,1fr)}.h2h-grid{grid-template-columns:1fr 1fr}.period-row{grid-template-columns:1fr 70px 70px}.period-row .hide-mobile{display:none}}@media(max-width:480px){.stats,.h2h-grid{grid-template-columns:1fr}.period-row{grid-template-columns:1fr 58px 58px}}

.site-header{width:min(1120px,calc(100% - 28px));margin:14px auto 0;background:rgba(7,19,31,.94);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;position:sticky;top:10px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.18)}
.site-header-inner{min-height:64px;padding:9px 14px;display:flex;align-items:center;gap:26px}.site-brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font-size:19px;font-weight:950;letter-spacing:-.4px}.site-brand-mark{width:30px;height:24px;position:relative}.site-brand-mark:before,.site-brand-mark:after{content:"";position:absolute;left:2px;right:2px;border:2px solid #526c84;border-radius:50%}.site-brand-mark:before{height:8px;bottom:2px}.site-brand-mark:after{height:5px;bottom:7px;left:7px;right:7px}.site-brand-mark i{position:absolute;left:11px;top:0;width:8px;height:8px;border:2px solid var(--teal);border-radius:50%;background:#0b1726}.site-nav{display:flex;gap:6px;flex:1}.site-nav a{color:#aebfd0;text-decoration:none;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:850}.site-nav a:hover{color:#fff;background:#11263a}.site-nav a.active{color:#fff;background:#173047;box-shadow:inset 0 -2px 0 var(--teal)}.site-admin-link{margin-left:auto;color:#dce8f2;text-decoration:none;border:1px solid #35556d;background:#10273b;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:850}.site-admin-link:hover{border-color:var(--teal)}
@media(max-width:680px){.site-header-inner{gap:8px;flex-wrap:wrap}.site-brand{font-size:17px}.site-nav{order:3;flex-basis:100%;border-top:1px solid rgba(53,82,107,.45);padding-top:7px}.site-nav a{flex:1;text-align:center;padding:8px 5px}}


.site-auth-btn{cursor:pointer;font-family:inherit}.auth-modal-backdrop{display:none;position:fixed;inset:0;background:rgba(2,8,14,.72);backdrop-filter:blur(4px);z-index:90}.auth-modal-backdrop.open{display:block}.auth-modal{display:none;position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(390px,calc(100% - 28px));padding:22px;z-index:91;box-shadow:0 28px 80px rgba(0,0,0,.48)}.auth-modal.open{display:block}.auth-modal h2{margin:0 0 16px;font-size:20px}.auth-modal-close{position:absolute;right:12px;top:10px;border:0;background:transparent;color:#a9bfd0;font-size:24px;cursor:pointer}.auth-modal input{width:100%;padding:11px 12px;margin-top:9px;border:1px solid #35556d;border-radius:10px;background:#081725;color:#fff;outline:none}.auth-modal .auth-submit{width:100%;margin-top:12px;padding:10px 12px;border:1px solid #39bdb3;border-radius:10px;background:linear-gradient(135deg,#2faaa5,#45c8bd);color:#fff;font-weight:850;cursor:pointer}.auth-error{min-height:18px;margin-top:9px;color:#ff9b9b;font-size:12px}
</style>
</head>
<body>
<header class="site-header"><div class="site-header-inner">
  <a class="site-brand" href="index.html"><span class="site-brand-mark"><i></i></span><span>KLASKLIGAN</span></a>
  <nav class="site-nav" aria-label="Huvudmeny"><a href="index.html">Tabell</a><a class="active" href="players.html">Spelarprofiler</a></nav>
  <button id="siteAuthBtn" type="button" class="site-admin-link site-auth-btn">Admin</button>
</div></header>
<div class="app">
<a class="back" href="players.html">← Alla spelarprofiler</a>
<div id="profileHero" class="panel hero"><div class="empty">Laddar spelarprofil…</div></div>
<section class="panel section"><div class="section-head"><h2>Statistik</h2><select id="periodSelect" class="select"></select></div><div id="stats" class="stats"></div><div style="margin-top:15px"><div class="eyebrow" style="margin-bottom:8px">Form · senaste 6</div><div id="form" class="form"></div></div></section>
<section class="panel section"><div class="section-head"><h2>H2H</h2><select id="opponentSelect" class="select"></select></div><div id="h2h" class="h2h-grid"></div></section>
<section class="panel section"><div class="section-head"><h2>Periodhistorik</h2></div><div id="periodHistory" class="period-list"></div></section>
</div>
<div id="editModal" class="modal hidden"><div class="modal-card"><h2 style="margin-top:0">Redigera profil</h2><div class="field"><label>Motto / slogan</label><input id="editMotto" maxlength="120"></div><div class="field"><label>Profilbild</label><input id="editImageFile" type="file" accept="image/jpeg,image/png,image/webp"><small style="display:block;margin-top:7px;color:var(--muted)">JPG, PNG eller WebP. Bilden laddas upp till Supabase Storage.</small><div id="currentImageNote" style="margin-top:7px;color:var(--muted);font-size:12px"></div><button id="removeImageBtn" type="button" class="btn" style="margin-top:9px;display:none">Ta bort profilbild</button></div><div class="actions"><button id="cancelEdit" class="btn">Avbryt</button><button id="saveEdit" class="btn">Spara</button></div></div></div>

<div id="authModalBackdrop" class="auth-modal-backdrop"></div><div id="authModal" class="panel auth-modal"><button id="authModalClose" class="auth-modal-close" type="button" aria-label="Stäng">×</button><h2>Logga in</h2><input id="siteAuthEmail" type="email" placeholder="E-post" autocomplete="username"><input id="siteAuthPassword" type="password" placeholder="Lösenord" autocomplete="current-password"><button id="siteAuthSubmit" class="auth-submit" type="button">Logga in</button><div id="siteAuthError" class="auth-error"></div></div>
<script>
const SUPABASE_URL='https://kqfrpvlelpoabfpkqjwn.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtxZnJwdmxlbHBvYWJmcGtxanduIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDI3OTMsImV4cCI6MjEwMzQ3ODc5M30.GS747AnOYChYZbpvwKMrrEwQcDMaIBIP5apFlhczPi0';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let siteSignedIn=false;
function setSiteAuthButton(){const b=document.getElementById('siteAuthBtn');if(b)b.textContent=siteSignedIn?'Logga ut':'Admin'}
function openSiteAuth(){document.getElementById('authModal')?.classList.add('open');document.getElementById('authModalBackdrop')?.classList.add('open');setTimeout(()=>document.getElementById('siteAuthEmail')?.focus(),40)}
function closeSiteAuth(){document.getElementById('authModal')?.classList.remove('open');document.getElementById('authModalBackdrop')?.classList.remove('open');}
async function initSiteAuth(){const {data:{session}}=await sb.auth.getSession();siteSignedIn=!!session;setSiteAuthButton();sb.auth.onAuthStateChange((_e,s)=>{siteSignedIn=!!s;setSiteAuthButton();if(!s)closeSiteAuth()});}
document.getElementById('siteAuthBtn')?.addEventListener('click',async()=>{if(siteSignedIn){await sb.auth.signOut();location.href='index.html';}else openSiteAuth()});
document.getElementById('authModalClose')?.addEventListener('click',closeSiteAuth);document.getElementById('authModalBackdrop')?.addEventListener('click',closeSiteAuth);
document.getElementById('siteAuthSubmit')?.addEventListener('click',async()=>{const email=document.getElementById('siteAuthEmail').value.trim(),password=document.getElementById('siteAuthPassword').value,err=document.getElementById('siteAuthError');err.textContent='';if(!email||!password){err.textContent='Fyll i e-post och lösenord.';return}const {error}=await sb.auth.signInWithPassword({email,password});if(error){err.textContent='Kunde inte logga in: '+error.message;return}document.getElementById('siteAuthPassword').value='';closeSiteAuth();location.reload()});
document.getElementById('siteAuthPassword')?.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('siteAuthSubmit')?.click()});
initSiteAuth();
 const M=18,C=.25,MIN=18;
let row=null,current=null,archive=[],playerId=Number(new URLSearchParams(location.search).get('id')),profilePlayer=null,isAdmin=false,canEditProfile=false,removeImageRequested=false;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function allPlayers(){const map=new Map();[...(current?.players||[]),...archive.flatMap(a=>a.players||[])].forEach(p=>{if(!map.has(Number(p.id)))map.set(Number(p.id),p)});return [...map.values()]}
function periods(){return [{key:'current',name:(current.listName||'Pågående period'),rounds:current.rounds||[],players:current.players||[],current:true},...archive.map(a=>({key:'a:'+a.id,name:a.name||'Tidigare period',rounds:a.rounds||[],players:a.players||[],current:false}))]}
function statsFor(pid,rounds){const mine=rounds.filter(r=>(r.player_ids||[]).map(Number).includes(pid));const losses=mine.filter(r=>Number(r.loser_id)===pid).length;const games=mine.length,pct=games?losses/games*100:null,score=games?100*((games/(games+M))*(losses/games)+(M/(games+M))*C):null;const form=[...mine].sort((a,b)=>new Date(b.played_at)-new Date(a.played_at)).slice(0,6).map(r=>Number(r.loser_id)===pid?'loss':'ok');return{games,losses,pct,score,form}}
function selectedPeriod(){const k=$('#periodSelect').value;if(k==='all')return{name:'Totalt',rounds:periods().flatMap(p=>p.rounds)};return periods().find(p=>p.key===k)||periods()[0]}
function rankInPeriod(pid,p){const stats=(p.players||allPlayers()).map(pl=>({id:Number(pl.id),...statsFor(Number(pl.id),p.rounds)})).filter(x=>x.games>=MIN).sort((a,b)=>a.score-b.score);const i=stats.findIndex(x=>x.id===pid);return i>=0?i+1:null}
function renderHero(){const initials=(profilePlayer.name||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();const img=profilePlayer.image_url?`<img src="${esc(profilePlayer.image_url)}" alt="${esc(profilePlayer.name)}">`:esc(initials);$('#profileHero').innerHTML=`<div class="avatar">${img}</div><div><div class="eyebrow">Spelarprofil</div><h1>${esc(profilePlayer.name)}</h1><p class="motto">${profilePlayer.motto?esc(profilePlayer.motto):'Ingen slogan ännu.'}</p></div><button id="editProfileBtn" class="btn admin-btn">Redigera profil</button>`;$('#editProfileBtn')?.addEventListener('click',()=>{$('#editMotto').value=profilePlayer.motto||'';$('#editImageFile').value='';removeImageRequested=false;$('#currentImageNote').textContent=profilePlayer.image_url?'Nuvarande profilbild finns sparad. Välj en ny fil för att ersätta den.':'Ingen profilbild uppladdad ännu.';$('#removeImageBtn').style.display=profilePlayer.image_url?'inline-flex':'none';$('#editModal').classList.remove('hidden')})}
function renderSelectors(){const ps=$('#periodSelect');ps.innerHTML='<option value="all">Totalt · alla perioder</option>'+periods().map(p=>`<option value="${p.key}">${esc(p.name)}${p.current?' · aktuell':''}</option>`).join('');ps.value='all';const opp=$('#opponentSelect');opp.innerHTML=allPlayers().filter(p=>Number(p.id)!==playerId).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
function renderStats(){const p=selectedPeriod(),s=statsFor(playerId,p.rounds);const position=p.key?rankInPeriod(playerId,p):null;$('#stats').innerHTML=`<div class="stat"><span>Matcher</span><b>${s.games}</b></div><div class="stat"><span>Förluster</span><b>${s.losses}</b></div><div class="stat"><span>Förlust %</span><b>${s.pct==null?'–':s.pct.toFixed(1).replace('.',',')+'%'}</b></div><div class="stat"><span>Bayesian score</span><b>${s.score==null?'–':s.score.toFixed(2).replace('.',',')}</b></div><div class="stat"><span>Placering</span><b>${position?position+'.':'–'}</b></div>`;$('#form').innerHTML=s.form.length?s.form.map(x=>`<span class="dot ${x==='loss'?'loss':''}"></span>`).join(''):'<span style="color:var(--muted)">Ingen formdata</span>';renderH2H()}
function renderH2H(){const oppId=Number($('#opponentSelect').value);const opp=allPlayers().find(p=>Number(p.id)===oppId);if(!opp){$('#h2h').innerHTML='<div class="empty">Ingen motspelare.</div>';return}const rounds=selectedPeriod().rounds.filter(r=>{const ids=(r.player_ids||[]).map(Number);return ids.includes(playerId)&&ids.includes(oppId)});const mine=rounds.filter(r=>Number(r.loser_id)===playerId).length,theirs=rounds.filter(r=>Number(r.loser_id)===oppId).length,other=rounds.length-mine-theirs;$('#h2h').innerHTML=`<div class="h2h-card"><span>Matcher tillsammans</span><b>${rounds.length}</b></div><div class="h2h-card"><span>${esc(profilePlayer.name)} förlorade</span><b>${mine}</b></div><div class="h2h-card"><span>${esc(opp.name)} förlorade</span><b>${theirs}</b></div><div class="h2h-card"><span>Övriga förlorade</span><b>${other}</b></div>`}
function renderHistory(){const root=$('#periodHistory');const items=periods().map(p=>{const s=statsFor(playerId,p.rounds),pos=rankInPeriod(playerId,p);return{s,p,pos}}).filter(x=>x.s.games>0);root.innerHTML=items.length?items.map(({s,p,pos})=>`<div class="period-row"><div class="name">${esc(p.name)}</div><div class="num">${s.games} matcher</div><div class="num">${s.losses} förl.</div><div class="num hide-mobile">${s.pct==null?'–':s.pct.toFixed(1).replace('.',',')+'%'}</div><div class="num hide-mobile">${pos?pos+'.':'DNQ'}</div></div>`).join(''):'<div class="empty">Ingen periodhistorik ännu.</div>'}
async function loadProfileMeta(){
  const {data,error}=await sb.from('klask_player_profiles').select('player_id,motto,image_url,image_path').eq('player_id',playerId).maybeSingle();
  if(!error&&data)profilePlayer={...profilePlayer,motto:data.motto||'',image_url:data.image_url||'',image_path:data.image_path||''};
}
async function resolvePermissions(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){isAdmin=false;canEditProfile=false;return;}
  const [{data:adminData},{data:editData}]=await Promise.all([
    sb.rpc('is_klask_admin'),
    sb.rpc('can_edit_klask_player',{p_player_id:playerId})
  ]);
  isAdmin=adminData===true;
  canEditProfile=editData===true;
}
async function saveProfile(){
  if(!canEditProfile)return alert('Du har inte behörighet att redigera den här profilen.');
  const saveBtn=$('#saveEdit');
  const file=$('#editImageFile')?.files?.[0]||null;
  if(file && !['image/jpeg','image/png','image/webp'].includes(file.type))return alert('Välj en JPG-, PNG- eller WebP-bild.');
  if(file && file.size>5*1024*1024)return alert('Bilden får vara högst 5 MB.');
  saveBtn.disabled=true; saveBtn.textContent='Sparar…';
  try{
    let imageUrl=profilePlayer.image_url||'';
    let imagePath=profilePlayer.image_path||'';
    if(removeImageRequested && imagePath){
      const {error:removeError}=await sb.storage.from('klask-images').remove([imagePath]);
      if(removeError)throw removeError;
      imageUrl=''; imagePath='';
    }
    if(file){
      const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
      const path=`player-images/${playerId}/profile.${ext||'jpg'}`;
      if(imagePath && imagePath!==path){
        await sb.storage.from('klask-images').remove([imagePath]);
      }
      const {error:uploadError}=await sb.storage.from('klask-images').upload(path,file,{upsert:true,contentType:file.type,cacheControl:'3600'});
      if(uploadError)throw uploadError;
      const {data:publicData}=sb.storage.from('klask-images').getPublicUrl(path);
      imageUrl=`${publicData.publicUrl}?v=${Date.now()}`;
      imagePath=path;
    }
    const motto=$('#editMotto').value.trim();
    const {data:{session}}=await sb.auth.getSession();
    const {error}=await sb.from('klask_player_profiles').upsert({player_id:playerId,motto,image_url:imageUrl,image_path:imagePath,updated_at:new Date().toISOString(),updated_by:session?.user?.id||null},{onConflict:'player_id'});
    if(error)throw error;
    profilePlayer={...profilePlayer,motto,image_url:imageUrl,image_path:imagePath};
    $('#editModal').classList.add('hidden');renderHero();
  }catch(err){alert(err?.message||'Kunde inte spara profilen. Kontrollera Supabase-policies.');}
  finally{saveBtn.disabled=false;saveBtn.textContent='Spara';}
}
async function init(){
  if(!playerId){$('#profileHero').innerHTML='<div class="empty">Ingen spelare vald.</div>';return}
  const {data,error}=await sb.from('klask_state').select('data,archive').eq('id',1).single();
  if(error){$('#profileHero').innerHTML='<div class="empty">Kunde inte läsa data.</div>';return}
  row=data;current=data.data||{};archive=Array.isArray(data.archive)?data.archive:[];
  profilePlayer=allPlayers().find(p=>Number(p.id)===playerId);
  if(!profilePlayer){$('#profileHero').innerHTML='<div class="empty">Spelaren hittades inte.</div>';return}
  await Promise.all([loadProfileMeta(),resolvePermissions()]);
  document.body.classList.toggle('is-admin',isAdmin);
  document.body.classList.toggle('can-edit-profile',canEditProfile);
  renderHero();renderSelectors();renderStats();renderHistory();
  $('#periodSelect').onchange=renderStats;$('#opponentSelect').onchange=renderH2H;
  $('#cancelEdit').onclick=()=>$('#editModal').classList.add('hidden');$('#removeImageBtn').onclick=()=>{removeImageRequested=true;$('#editImageFile').value='';$('#currentImageNote').textContent='Profilbilden tas bort när du sparar.';$('#removeImageBtn').style.display='none';};$('#saveEdit').onclick=saveProfile;
}
init();
</script></body></html>
